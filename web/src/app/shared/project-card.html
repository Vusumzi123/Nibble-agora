<a
  class="project-card"
  [routerLink]="link()"
  [class.project-card--active]="active()"
>
  <span class="project-card__name" appEllipsis>{{ project().name }}</span>
  @if (project().description) {
    <span class="project-card__desc" [appEllipsis]="4">{{ project().description }}</span>
  }
  <span class="project-card__meta ph-label">
    <span appEllipsis>{{ project().slug }}</span>
    <span appEllipsis>{{ i18n.t('boards.columnsCount', { count: columns() }) }}</span>
  </span>
  <span class="project-card__tip">{{ i18n.t('boards.seeBoard') }}</span>
</a>
