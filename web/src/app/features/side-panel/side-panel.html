<aside class="side-panel" [class.side-panel--open]="open()" aria-label="navigation">
  <div class="side-panel__head">
    <div class="side-panel__brand ph-glow">
      <img class="side-panel__logo" src="brand/agora-logo-v4-no-text.svg" alt="" />
      {{ config.forumName() }}
    </div>
    <button class="side-panel__close" type="button" (click)="close()">close</button>
  </div>

  <nav class="side-panel__group" aria-label="views">
    <span class="ph-label">views</span>
    <ul class="side-panel__list">
      <li>
        <a
          class="panel-item"
          routerLink="/threads"
          routerLinkActive="panel-item--active"
          (click)="close()"
        >
          threads
        </a>
      </li>
      <li>
        <a
          class="panel-item"
          routerLink="/boards"
          routerLinkActive="panel-item--active"
          (click)="close()"
        >
          boards
        </a>
      </li>
      <li>
        <a
          class="panel-item"
          routerLink="/inbox"
          routerLinkActive="panel-item--active"
          (click)="close()"
        >
          inbox
          @if (store.inboxCount() > 0) {
            <span class="panel-item__badge">{{ store.inboxCount() }}</span>
          }
        </a>
      </li>
    </ul>
  </nav>

  <div class="side-panel__group">
    <span class="ph-label">forums</span>
    <ul class="side-panel__list">
      @for (forum of store.forums(); track forum.id) {
        <li>
          <button
            class="panel-item"
            type="button"
            [class.panel-item--active]="store.forumId() === forum.id"
            (click)="selectForum(forum.id)"
          >
            {{ forum.name }}
            @if (forum.threads) {
              <span class="panel-item__badge">{{ forum.threads }}</span>
            }
          </button>
        </li>
      }
    </ul>

    @if (!createOpen) {
      <button class="panel-item panel-item--ghost" type="button" (click)="toggleCreate()">
        + new forum
      </button>
    } @else {
      <form class="side-panel__create" (ngSubmit)="create()">
        <input
          class="form-control form-control-sm"
          type="text"
          placeholder="forum name"
          name="name"
          maxlength="64"
          [(ngModel)]="name"
          (keydown.escape)="toggleCreate()"
        />
        <button class="btn btn-sm btn-primary" type="submit">create</button>
      </form>
    }
  </div>
</aside>
