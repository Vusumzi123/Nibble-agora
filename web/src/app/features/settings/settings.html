<section id="view-settings" class="view">
  <div class="view__head">
    <span class="ph-label">settings</span>
    <span class="badge text-bg-secondary">@{{ config.forumName() }}</span>
  </div>

  <section class="ph-panel">
    <header class="ph-panel__header">appearance</header>
    <div class="ph-panel__body">
      <p class="ph-label">mode — applied to every seat immediately</p>
      <div class="theme-switch-row">
        <span class="theme-switch__end" [class.theme-switch__end--active]="!modeIsLight">
          dark
        </span>
        <label class="theme-switch">
          <input
            type="checkbox"
            role="switch"
            aria-label="light mode"
            [checked]="modeIsLight"
            (change)="toggleMode($event)"
          />
          <span class="theme-switch__track"></span>
        </label>
        <span class="theme-switch__end" [class.theme-switch__end--active]="modeIsLight">
          light
        </span>
      </div>
      <p class="ph-label">accent — applied to every seat immediately</p>
      <div class="accent-row">
        @for (a of accents; track a.id) {
          <button
            type="button"
            class="accent-swatch"
            [attr.data-accent]="a.id"
            [class.accent-swatch--active]="config.accent() === a.id"
            [attr.aria-pressed]="config.accent() === a.id"
            [attr.title]="a.label"
            (click)="pickAccent(a.id)"
          >
            <span class="accent-swatch__dot" [style.backgroundColor]="a.hex"></span>
            {{ a.label }}
          </button>
        }
      </div>
    </div>
  </section>

  <section class="ph-panel">
    <header class="ph-panel__header">forum</header>
    <div class="ph-panel__body">
      <label class="field-stack">
        <span class="ph-label">forum name</span>
        <input class="form-control" type="text" maxlength="64" [(ngModel)]="forumName" />
      </label>
      <div class="composer__actions">
        <button class="btn btn-primary" type="button" [disabled]="savingName" (click)="saveName()">
          {{ savingName ? 'saving…' : 'save name' }}
        </button>
      </div>
    </div>
  </section>

  <section class="ph-panel">
    <header class="ph-panel__header">password</header>
    <div class="ph-panel__body">
      <label class="field-stack">
        <span class="ph-label">current password</span>
        <input class="form-control" type="password" autocomplete="current-password" [(ngModel)]="current" />
      </label>
      <div class="field-row">
        <label class="field-stack">
          <span class="ph-label">new password</span>
          <input class="form-control" type="password" autocomplete="new-password" [(ngModel)]="next" />
        </label>
        <label class="field-stack">
          <span class="ph-label">confirm new password</span>
          <input class="form-control" type="password" autocomplete="new-password" [(ngModel)]="confirm" />
        </label>
      </div>
      <div class="composer__actions">
        <button class="btn btn-primary" type="button" [disabled]="savingPassword" (click)="savePassword()">
          {{ savingPassword ? 'saving…' : 'change password' }}
        </button>
      </div>
    </div>
  </section>
</section>
