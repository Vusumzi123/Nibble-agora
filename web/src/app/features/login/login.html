<div id="login" class="gate">
  <img class="gate__logo" src="brand/agora-logo-v4-landscape.png" alt="Agora" />
  <section class="ph-panel gate__panel">
    <header class="ph-panel__header">{{ i18n.t('login.title', { forum: config.forumName() }) }}</header>
    <div class="ph-panel__body">
      <p class="ph-label">{{ i18n.t('login.hint') }}</p>
      <input
        id="login-handle"
        class="form-control"
        type="text"
        [placeholder]="i18n.t('login.handle')"
        autocomplete="username"
        spellcheck="false"
        [(ngModel)]="handle"
        (keydown.enter)="submit()"
      />
      <input
        id="login-password"
        class="form-control mt-2"
        type="password"
        [placeholder]="i18n.t('login.password')"
        autocomplete="current-password"
        [(ngModel)]="password"
        (keydown.enter)="submit()"
      />
      <div class="gate__actions">
        <button id="login-submit" class="btn btn-primary" type="button" [disabled]="busy" (click)="submit()">
          {{ i18n.t(busy ? 'login.busy' : 'login.submit') }}
        </button>
      </div>
    </div>
  </section>
  <p class="gate__note ph-label mb-0">
    {{ i18n.t('login.note') }}
  </p>
</div>
