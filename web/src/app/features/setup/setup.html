<div id="setup" class="setup">
  <section class="ph-panel setup__panel">
    <img class="gate__logo" src="brand/agora-logo-v4-landscape.png" alt="Agora" />
    <header class="ph-panel__header">{{ i18n.t('setup.title') }}</header>
    <div class="ph-panel__body">
      <p class="ph-label">
        {{ i18n.t('setup.intro') }} <em>{{ i18n.t('shell.settings') }}</em>.
      </p>

      <label class="field">
        <span class="ph-label">{{ i18n.t('setup.forumName') }}</span>
        <input class="form-control" type="text" maxlength="64" [(ngModel)]="forumName" placeholder="Agora" />
      </label>

      <label class="field">
        <span class="ph-label">{{ i18n.t('setup.adminHandle') }}</span>
        <input class="form-control" type="text" autocomplete="username" spellcheck="false" [(ngModel)]="handle" />
      </label>

      <div class="field-row">
        <label class="field">
          <span class="ph-label">{{ i18n.t('setup.password') }}</span>
          <input class="form-control" type="password" autocomplete="new-password" [(ngModel)]="password" />
        </label>
        <label class="field">
          <span class="ph-label">{{ i18n.t('setup.confirmPassword') }}</span>
          <input class="form-control" type="password" autocomplete="new-password" [(ngModel)]="confirm" />
        </label>
      </div>

      <label class="field field--row">
        <span class="field__label">{{ i18n.t('setup.mode') }}</span>
        <span class="theme-switch-row">
          <span class="theme-switch__end" [class.theme-switch__end--active]="!modeIsLight">{{ i18n.t('settings.dark') }}</span>
          <span class="theme-switch">
            <input
              type="checkbox"
              role="switch"
              [attr.aria-label]="i18n.t('settings.lightMode')"
              [checked]="modeIsLight"
              (change)="toggleMode($event)"
            />
            <span class="theme-switch__track"></span>
          </span>
          <span class="theme-switch__end" [class.theme-switch__end--active]="modeIsLight">{{ i18n.t('settings.light') }}</span>
        </span>
      </label>

      <div class="field">
        <span class="ph-label">{{ i18n.t('setup.accent') }}</span>
        <div class="accent-row">
          @for (a of accents; track a.id) {
            <button
              type="button"
              class="accent-swatch"
              [attr.data-accent]="a.id"
              [class.accent-swatch--active]="accent === a.id"
              [attr.aria-pressed]="accent === a.id"
              [attr.title]="a.label"
              (click)="pickAccent(a.id)"
            >
              <span class="accent-swatch__dot" [style.backgroundColor]="a.hex"></span>
              {{ a.label }}
            </button>
          }
        </div>
      </div>

      <div class="gate__actions">
        <button id="setup-submit" class="btn btn-primary" type="button" [disabled]="busy" (click)="submit()">
          {{ i18n.t(busy ? 'setup.busy' : 'setup.submit') }}
        </button>
      </div>
    </div>
  </section>
</div>
