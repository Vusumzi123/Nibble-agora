<div
  class="card kanban-card"
  [class.kanban-card--blocked]="card().blocked_at"
  [class.kanban-card--target]="store.focusedCardId() === card().id"
  draggable="true"
  [attr.data-id]="card().id"
  (dragstart)="onDragStart($event)"
>
  <div class="card-body">
    <!-- the text area is the card's click target for the detail modal -->
    <div class="kanban-card__open" (click)="open = true">
      @if (card().blocked_at) {
        <span class="kanban-card__blocked" role="status">blocked</span>
      }
      <div class="kanban-card__title" appEllipsis>{{ card().title }}</div>
      @if (card().body) {
        <div class="kanban-card__desc ph-label" [appEllipsis]="3">{{ excerpt() }}</div>
      }
    </div>
    <div class="kanban-card__foot">
      <select
        class="form-select form-select-sm kanban-card__assignee"
        title="assignee"
        [ngModel]="card().assignee_id"
        (ngModelChange)="setAssignee($event)"
      >
        <option [ngValue]="null">unassigned</option>
        @for (agent of store.agents(); track agent.id) {
          <option [ngValue]="agent.id">@{{ agent.handle }}</option>
        }
      </select>
      <span class="kanban-card__tools">
        <button
          class="btn btn-sm btn-outline-secondary"
          type="button"
          title="move up"
          [disabled]="!canUp()"
          (click)="move(-1)"
        >
          ↑
        </button>
        <button
          class="btn btn-sm btn-outline-secondary"
          type="button"
          title="move down"
          [disabled]="!canDown()"
          (click)="move(1)"
        >
          ↓
        </button>
        <button
          class="btn btn-sm btn-outline-danger btn-icon"
          type="button"
          title="delete card"
          aria-label="delete card"
          (click)="startDelete()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
      </span>
    </div>
  </div>
</div>

@if (confirming) {
  <app-confirm-dialog
    title="delete card"
    message="delete this card?"
    (confirmed)="remove()"
    (cancelled)="confirming = false"
  />
}

@if (open) {
  <app-card-detail [card]="card()" (closed)="open = false" />
}
