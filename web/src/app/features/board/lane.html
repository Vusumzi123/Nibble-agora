<section class="lane" [class.lane--over]="over" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onLaneDrop($event)">
  <!-- Grabbing the header drags the column; the header goes inert mid-rename
       so the inline input stays selectable. -->
  <header
    class="lane__head"
    [attr.draggable]="editing ? null : 'true'"
    (dragstart)="onDragStart($event)"
    (dragend)="over = false"
  >
    @if (editing) {
      <input
        #renameInput
        class="form-control form-control-sm lane__rename"
        type="text"
        maxlength="64"
        [(ngModel)]="editName"
        (blur)="commitRename()"
        (keydown.enter)="commitRename()"
        (keydown.escape)="cancelRename()"
      />
    } @else {
      <span class="lane__name" appEllipsis (dblclick)="startRename()">
        {{ column().name }}
      </span>
    }
    <span class="badge text-bg-secondary">{{ cards().length }}</span>
    <span class="lane__tools">
      <button
        class="btn btn-sm btn-outline-secondary btn-icon"
        type="button"
        [title]="i18n.t('board.addCard')"
        [attr.aria-label]="i18n.t('board.addCard')"
        (click)="startAddCard()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 5v14" />
          <path d="M5 12h14" />
        </svg>
      </button>
      <button
        class="btn btn-sm btn-outline-secondary btn-icon"
        type="button"
        [title]="i18n.t('board.deleteColumn')"
        [attr.aria-label]="i18n.t('board.deleteColumn')"
        (click)="startDelete()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 6h18" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
      </button>
    </span>
  </header>

  <div
    #cardsEl
    class="lane__cards"
    (dragover)="onCardsDragOver($event)"
    (dragleave)="onCardsDragLeave($event)"
    (drop)="onDrop($event)"
  >
    @if (loading() && !cards().length) {
      @for (i of skeletons; track i) {
        <div class="card kanban-card kanban-card--skeleton" aria-hidden="true">
          <div class="card-body">
            <span class="skeleton skeleton--card-title"></span>
            <span class="skeleton skeleton--card-line"></span>
            <span class="skeleton skeleton--card-line skeleton--short"></span>
            <div class="kanban-card__foot">
              <span class="skeleton skeleton--card-pill"></span>
              <span class="skeleton skeleton--card-chip"></span>
              <span class="skeleton skeleton--card-chip"></span>
            </div>
          </div>
        </div>
      }
    }
    @for (row of rows(); track $index) {
      @if (row.gap) {
        <div class="kanban-card kanban-card--placeholder" aria-hidden="true"></div>
      } @else if (row.card) {
        <app-card-tile [card]="row.card" />
      }
    }
  </div>
</section>

@if (creating) {
  <app-card-detail [columnId]="column().id" (closed)="creating = false" />
}

@if (confirming) {
  <app-confirm-dialog
    [title]="i18n.t('board.deleteColumn')"
    [message]="i18n.t('board.deleteColumnMessage')"
    (confirmed)="deleteColumn()"
    (cancelled)="confirming = false"
  />
}
