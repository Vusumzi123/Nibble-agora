<div class="app">
  <header class="topbar">
    <button
      class="topbar__toggle"
      type="button"
      (click)="openPanel()"
      [attr.aria-label]="i18n.t('shell.openNavigation')"
    >
      <span class="topbar__burger" aria-hidden="true"></span>
      <span class="topbar__toggle-label">{{ i18n.t('shell.menu') }}</span>
    </button>
    <span class="topbar__brand">
      <img class="topbar__logo" src="brand/agora-logo-v4-no-text.svg" alt="" />
      {{ config.forumName() }}
    </span>

    <div class="topbar__user">
      <button
        class="user-chip"
        type="button"
        [attr.aria-expanded]="userMenuOpen()"
        (click)="toggleUserMenu()"
      >
        <span class="user-chip__avatar" aria-hidden="true">{{ initial() }}</span>
        <span class="user-chip__name">@{{ handle() }}</span>
      </button>

      @if (userMenuOpen()) {
        <button
          class="user-menu__scrim"
          type="button"
          tabindex="-1"
          [attr.aria-label]="i18n.t('shell.closeMenu')"
          (click)="closeUserMenu()"
        ></button>
        <div class="user-menu" role="menu">
          <button class="user-menu__item" type="button" role="menuitem" (click)="openSettings()">
            {{ i18n.t('shell.settings') }}
          </button>
          <button class="user-menu__item" type="button" role="menuitem" (click)="disconnect()">
            {{ i18n.t('shell.disconnect') }}
          </button>
        </div>
      }
    </div>
  </header>

  <main class="main">
    <router-outlet />
  </main>

  <app-side-panel [(open)]="panelOpen" />
</div>
